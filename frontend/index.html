<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星梦智能助手</title>
<style>
:root{
  --bg:#070b16; --bg2:#0b1122;
  --card:#0e1730; --card2:#0a1226;
  --line:#1d2a4d; --line2:#2b3c68;
  --txt:#e6ecff; --txt2:#93a0c8; --txt3:#5c6a95;
  --ac:#5b8cff; --ac2:#8b5cf6;
  --grad:linear-gradient(135deg,#5b8cff,#8b5cf6);
  --ok:#3ddc97; --warn:#f5c76b; --danger:#ff6b81;
  --r:14px; --rs:9px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--txt);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  position:relative; overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 15% -10%,rgba(91,140,255,.10),transparent 60%),
    radial-gradient(1000px 600px at 110% 110%,rgba(139,92,246,.10),transparent 60%);
}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;background:#cdd8ff;border-radius:50%;opacity:.35}

/* 顶栏 */
.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:26px 48px;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:600;letter-spacing:1px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center}
.tlinks{display:flex;gap:12px}
.tlink{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line2);
  color:var(--txt2);font-size:14px;font-family:inherit;padding:8px 18px;border-radius:18px;cursor:pointer;transition:.2s}
.tlink:hover{color:var(--txt);border-color:var(--ac)}
.tlink.out:hover{color:var(--danger);border-color:var(--danger)}

/* 主内容 */
.home-box{display:flex;flex-direction:column;align-items:center;gap:52px;padding:40px 20px}
.home-tt{text-align:center}
.home-tt .en{font-size:12px;letter-spacing:6px;color:var(--ac);margin-bottom:20px}
.home-tt h1{font-size:56px;font-weight:300;letter-spacing:8px;margin-bottom:14px}
.home-tt p{font-size:15px;color:var(--txt3);letter-spacing:2px}
.home-cards{display:flex;flex-direction:column;gap:28px}
.fcard{width:340px;height:250px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  cursor:pointer;transition:.25s;text-align:center;padding:0 28px}
.fcard:hover{transform:translateY(-5px);border-color:var(--line2);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.ficon{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.fcard h3{font-size:22px;font-weight:500;letter-spacing:2px}
.fcard p{font-size:13px;color:var(--txt3);line-height:1.7}
.fenter{font-size:13px;color:var(--txt2)}
.fcard:hover .fenter{color:var(--ac)}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round">
        <path d="M12 3l2.4 5.2 5.6.7-4.1 3.9 1 5.6-4.9-2.7-4.9 2.7 1-5.6L4 8.9l5.6-.7z"/>
      </svg>
    </div>星梦智能助手
  </div>
  <div class="tlinks">
    <button type="button" class="tlink" id="btn-history">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      历史记录
    </button>
    <button type="button" class="tlink out" id="btn-logout">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      退出登录
    </button>
  </div>
</header>

<!-- 主内容：文本 + 两个入口，从上往下依次排列 -->
<main class="home-box">
  <div class="home-tt">
    <div class="en">AI · ASTROLOGY · DREAM</div>
    <h1>星梦智能助手</h1>
    <p>以星空为引，以梦境为镜</p>
  </div>
  <div class="home-cards">
    <div class="fcard" id="card-astro">
      <div class="ficon" style="background:rgba(91,140,255,.13)">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#5b8cff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
        </svg>
      </div>
      <h3>星座分析</h3>
      <p>根据出生日期推算太阳星座<br>生成专属性格与运势报告</p>
      <span class="fenter">点击进入 →</span>
    </div>
    <div class="fcard" id="card-dream">
      <div class="ficon" style="background:rgba(139,92,246,.15)">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>
        </svg>
      </div>
      <h3>周公解梦</h3>
      <p>描述你的梦境<br>获取 AI 个性化解读与建议</p>
      <span class="fenter">点击进入 →</span>
    </div>
  </div>
</main>

<script>
/* ===== 星空背景 ===== */
(function () {
  const c = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 1;
    s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + Math.random() * 100 + '%;top:' +
      Math.random() * 100 + '%;opacity:' + (Math.random() * .4 + .15);
    c.appendChild(s);
  }
})();

/* ===== 登录态检查：未登录跳登录页 ===== */
function getToken() {
  return localStorage.getItem('token') || sessionStorage.getItem('token');
}
if (!getToken()) {
  window.location.href = 'login.html';
}

/* ===== 入口跳转 ===== */
document.getElementById('card-astro').onclick = () => { window.location.href = 'astro.html'; };
document.getElementById('card-dream').onclick = () => { window.location.href = 'dream.html'; };
document.getElementById('btn-history').onclick = () => { window.location.href = 'history.html'; };

/* ===== 退出登录：清除登录状态，跳登录页（不做二次确认） ===== */
document.getElementById('btn-logout').onclick = () => {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  sessionStorage.removeItem('token');
  sessionStorage.removeItem('user');
  window.location.href = 'login.html';
};
</script>
</body>
</html>
