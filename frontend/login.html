<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 - 星梦智能助手</title>
<style>
:root{
  --bg:#070b16; --bg2:#0b1122;
  --card:#0e1730; --card2:#0a1226;
  --line:#1d2a4d; --line2:#2b3c68;
  --txt:#e6ecff; --txt2:#93a0c8; --txt3:#5c6a95;
  --ac:#5b8cff; --ac2:#8b5cf6;
  --grad:linear-gradient(135deg,#5b8cff,#8b5cf6);
  --ok:#3ddc97; --warn:#f5c76b; --danger:#ff6b81;
  --r:14px; --rs:9px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--txt);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  position:relative; overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 15% -10%,rgba(91,140,255,.10),transparent 60%),
    radial-gradient(1000px 600px at 110% 110%,rgba(139,92,246,.10),transparent 60%);
}
.stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;background:#cdd8ff;border-radius:50%;opacity:.35}

/* 布局 */
.auth-box{display:flex;flex-direction:column;align-items:center;gap:30px;padding:40px 20px}
.auth-brand{text-align:center}
.auth-brand .logo{width:66px;height:66px;border-radius:18px;margin:0 auto 18px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(91,140,255,.35)}
.auth-brand h1{font-size:28px;letter-spacing:5px;font-weight:600;margin-bottom:8px}
.auth-brand p{font-size:13px;color:var(--txt3);letter-spacing:2px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.auth-card{width:430px;padding:34px 38px}

/* tab */
.tabs{display:flex;gap:6px;background:var(--card2);border-radius:10px;padding:5px;margin-bottom:26px}
.tab{flex:1;height:40px;border:none;border-radius:7px;background:transparent;color:var(--txt2);
  font-family:inherit;font-size:15px;cursor:pointer;transition:.2s}
.tab.on{background:var(--grad);color:#fff}
.aform{display:none}
.aform.on{display:block}

/* 表单 */
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--txt2);margin-bottom:8px}
.req{color:var(--ac);margin-left:2px}
.in{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);
  color:var(--txt);font-family:inherit;font-size:15px;height:44px;padding:0 14px;outline:none;transition:.2s}
.in::placeholder{color:var(--txt3)}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
.in.error{border-color:var(--danger)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
  font-family:inherit;font-size:16px;border-radius:var(--rs);height:46px;padding:0 28px;transition:.2s;color:var(--txt)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(91,140,255,.28)}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-p:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-b{width:100%}
.btn-lg{height:52px;font-size:17px;letter-spacing:2px}

/* 记住我 */
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--txt2);user-select:none}
.chk input{accent-color:var(--ac);width:16px;height:16px;cursor:pointer}

/* 切换链接 */
.switch{text-align:center;margin-top:20px;font-size:13px;color:var(--txt3)}
.switch a{color:var(--ac);cursor:pointer;text-decoration:none}
.switch a:hover{text-decoration:underline}

/* 错误提示 */
.alert{display:none;margin-bottom:16px;padding:10px 14px;border-radius:8px;
  background:rgba(255,107,129,.1);border:1px solid rgba(255,107,129,.3);
  color:var(--danger);font-size:13px;line-height:1.5}
.alert.show{display:block}
.alert.ok{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.3);color:var(--ok)}
.err{display:none;margin-top:6px;font-size:12px;color:var(--danger)}
.err.show{display:block}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="auth-box">
  <div class="auth-brand">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round">
        <path d="M12 3l2.4 5.2 5.6.7-4.1 3.9 1 5.6-4.9-2.7-4.9 2.7 1-5.6L4 8.9l5.6-.7z"/>
      </svg>
    </div>
    <h1>星梦智能助手</h1>
    <p>探寻星座之秘 · 解读梦境之意</p>
  </div>

  <div class="card auth-card">
    <div class="tabs">
      <button type="button" class="tab on" id="tab-login">登 录</button>
      <button type="button" class="tab" id="tab-register">注 册</button>
    </div>

    <!-- 登录表单 -->
    <form class="aform on" id="f-login" novalidate>
      <div class="alert" id="login-alert"></div>
      <div class="field">
        <label>用户名<span class="req">*</span></label>
        <input class="in" id="login-username" placeholder="请输入用户名" autocomplete="username">
        <div class="err" id="login-username-err"></div>
      </div>
      <div class="field">
        <label>密码<span class="req">*</span></label>
        <input class="in" id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
        <div class="err" id="login-password-err"></div>
      </div>
      <div class="field" style="margin-bottom:24px">
        <label class="chk"><input type="checkbox" id="remember-me">记住我（登录状态保持 7 天）</label>
      </div>
      <button type="submit" class="btn btn-p btn-b btn-lg" id="login-btn">登 录</button>
      <div class="switch">还没有账号？<a id="to-register">立即注册</a></div>
    </form>

    <!-- 注册表单 -->
    <form class="aform" id="f-register" novalidate>
      <div class="alert" id="register-alert"></div>
      <div class="field">
        <label>用户名<span class="req">*</span></label>
        <input class="in" id="reg-username" placeholder="3-20 位字母、数字或下划线" autocomplete="username">
        <div class="err" id="reg-username-err"></div>
      </div>
      <div class="field">
        <label>密码<span class="req">*</span></label>
        <input class="in" id="reg-password" type="password" placeholder="6-20 位字符" autocomplete="new-password">
        <div class="err" id="reg-password-err"></div>
      </div>
      <div class="field">
        <label>再次输入密码<span class="req">*</span></label>
        <input class="in" id="reg-confirm" type="password" placeholder="请再次输入密码" autocomplete="new-password">
        <div class="err" id="reg-confirm-err"></div>
      </div>
      <div class="field" style="margin-bottom:24px">
        <label>邮箱<span class="req">*</span></label>
        <input class="in" id="reg-email" placeholder="请输入邮箱地址" autocomplete="email">
        <div class="err" id="reg-email-err"></div>
      </div>
      <button type="submit" class="btn btn-p btn-b btn-lg" id="register-btn">注 册</button>
      <div class="switch">已有账号？<a id="to-login">立即登录</a></div>
    </form>
  </div>
</div>

<script>
/* ===== 星空背景 ===== */
(function () {
  const c = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 1;
    s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + Math.random() * 100 + '%;top:' +
      Math.random() * 100 + '%;opacity:' + (Math.random() * .4 + .15);
    c.appendChild(s);
  }
})();

const API_BASE = '/api';
const $ = (id) => document.getElementById(id);

/* ===== 登录 / 注册 tab 切换 ===== */
function switchTab(t) {
  const isLogin = t === 'login';
  $('tab-login').classList.toggle('on', isLogin);
  $('tab-register').classList.toggle('on', !isLogin);
  $('f-login').classList.toggle('on', isLogin);
  $('f-register').classList.toggle('on', !isLogin);
  // 切换时清空提示
  clearAlert('login-alert');
  clearAlert('register-alert');
  clearAllErr();
}
$('tab-login').onclick = () => switchTab('login');
$('tab-register').onclick = () => switchTab('register');
$('to-register').onclick = () => switchTab('register');
$('to-login').onclick = () => switchTab('login');

/* ===== 提示工具函数 ===== */
function showAlert(id, msg, ok) {
  const el = $(id);
  el.textContent = msg;
  el.classList.toggle('ok', !!ok);
  el.classList.add('show');
}
function clearAlert(id) {
  const el = $(id);
  el.classList.remove('show', 'ok');
  el.textContent = '';
}
function showErr(id, msg) {
  const el = $(id);
  el.textContent = msg;
  el.classList.add('show');
}
function clearErr(id) {
  $(id).classList.remove('show');
}
function clearAllErr() {
  document.querySelectorAll('.err').forEach(e => e.classList.remove('show'));
  document.querySelectorAll('.in').forEach(e => e.classList.remove('error'));
}
function setLoading(btnId, loading, text) {
  const btn = $(btnId);
  if (loading) {
    btn.dataset.origin = btn.textContent;
    btn.textContent = text || '提交中...';
    btn.disabled = true;
  } else {
    btn.textContent = btn.dataset.origin || btn.textContent;
    btn.disabled = false;
  }
}

/* ===== 统一请求 ===== */
async function postJSON(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  try {
    return await res.json();
  } catch (e) {
    throw new Error('响应解析失败');
  }
}

/* ===== 登录 ===== */
$('f-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert('login-alert');
  clearAllErr();

  const username = $('login-username').value.trim();
  const password = $('login-password').value;
  const rememberMe = $('remember-me').checked;

  // 前端校验
  let ok = true;
  if (!username) { showErr('login-username-err', '用户名不能为空'); ok = false; }
  if (!password) { showErr('login-password-err', '密码不能为空'); ok = false; }
  if (!ok) return;

  setLoading('login-btn', true, '登录中...');
  try {
    const data = await postJSON('/auth/login', { username, password, remember_me: rememberMe });
    if (data.code === 0) {
      // 记住我：localStorage（7 天）；否则 sessionStorage（浏览器关闭失效）
      const storage = rememberMe ? localStorage : sessionStorage;
      storage.setItem('token', data.data.token);
      storage.setItem('user', JSON.stringify(data.data.user));
      window.location.href = 'index.html'; // 跳转主页面
    } else {
      showAlert('login-alert', data.message || '登录失败');
    }
  } catch (err) {
    showAlert('login-alert', '网络错误，请稍后重试');
  } finally {
    setLoading('login-btn', false);
  }
});

/* ===== 注册 ===== */
$('f-register').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert('register-alert');
  clearAllErr();

  const username = $('reg-username').value.trim();
  const password = $('reg-password').value;
  const confirm = $('reg-confirm').value;
  const email = $('reg-email').value.trim();

  // 前端校验
  let ok = true;
  if (!username) {
    showErr('reg-username-err', '用户名不能为空'); ok = false;
  } else if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
    showErr('reg-username-err', '用户名需为 3-20 位字母、数字或下划线'); ok = false;
  }
  if (!password) {
    showErr('reg-password-err', '密码不能为空'); ok = false;
  } else if (password.length < 6 || password.length > 20) {
    showErr('reg-password-err', '密码长度需为 6-20 位'); ok = false;
  }
  if (!confirm) {
    showErr('reg-confirm-err', '请再次输入密码'); ok = false;
  } else if (confirm !== password) {
    showErr('reg-confirm-err', '密码不一致，请重新输入'); ok = false;
  }
  if (!email) {
    showErr('reg-email-err', '邮箱不能为空'); ok = false;
  } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showErr('reg-email-err', '请输入正确的邮箱格式'); ok = false;
  }
  if (!ok) return;

  setLoading('register-btn', true, '注册中...');
  try {
    const data = await postJSON('/auth/register', { username, password, email });
    if (data.code === 0) {
      // 注册成功：提示并切回登录页，预填用户名
      $('login-username').value = username;
      switchTab('login');
      showAlert('login-alert', '注册成功，请登录', true);
    } else {
      showAlert('register-alert', data.message || '注册失败');
    }
  } catch (err) {
    showAlert('register-alert', '网络错误，请稍后重试');
  } finally {
    setLoading('register-btn', false);
  }
});
</script>
</body>
</html>
